name: Bug report
description: Something does not work as described. You can write in any language.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, a failing test, or steps. The output of ./init.sh helps.
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, Node, Python, forge --version
